name: Verify website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: main
            index: 'true'
          - branch: preview
            index: 'false'
    env:
      INDEX_SITE: 'true'
      CF_PAGES: '1'
      CF_PAGES_BRANCH: ${{ matrix.branch }}
      EXPECT_INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
