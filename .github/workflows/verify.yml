name: Verify website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: production
            index: 'true'
          - environment: preview
            index: 'false'
    env:
      INDEX_SITE: 'true'
      DEPLOY_ENV: ${{ matrix.environment }}
      EXPECT_INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run hosting:test
