name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: production
      INDEX_SITE: ${{ vars.INDEX_SITE == 'true' && 'true' || 'false' }}
      EXPECT_INDEX: ${{ vars.INDEX_SITE == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run hosting:test
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIHARYBALASSA_99E15 }}
          channelId: live
          projectId: biharybalassa-99e15
          firebaseToolsVersion: 15.37.0
