name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Hosting channel
        type: choice
        options: [review, live]
        default: review
permissions:
  contents: read
concurrency:
  group: firebase-hosting-${{ github.event.inputs.channel || 'live' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: biharybalassa-99e15
      DEPLOY_CHANNEL: ${{ github.event.inputs.channel || 'live' }}
      DEPLOY_ENV: ${{ github.event.inputs.channel == 'review' && 'preview' || 'production' }}
      INDEX_SITE: ${{ github.event.inputs.channel != 'review' && vars.INDEX_SITE == 'true' && 'true' || 'false' }}
      EXPECT_INDEX: ${{ github.event.inputs.channel != 'review' && vars.INDEX_SITE == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run hosting:test
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: biharybalassa-99e15
          workload_identity_provider: projects/924538517728/locations/global/workloadIdentityPools/github-hosting/providers/github-main
          service_account: github-hosting-deployer@biharybalassa-99e15.iam.gserviceaccount.com
      - name: Deploy verified build
        run: |
          if [ "$DEPLOY_CHANNEL" = "live" ]; then
            npx --no-install firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
          else
            npx --no-install firebase hosting:channel:deploy review --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi
