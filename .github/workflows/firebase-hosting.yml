name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Hosting channel
        type: choice
        options: [review, live]
        default: review
permissions:
  contents: read
concurrency:
  group: firebase-hosting-${{ github.event.inputs.channel || 'live' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.FIREBASE_PROJECT_ID != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event.inputs.channel == 'review' && 'preview' || 'production' }}
      INDEX_SITE: ${{ github.event.inputs.channel != 'review' && vars.INDEX_SITE == 'true' && 'true' || 'false' }}
      EXPECT_INDEX: ${{ github.event.inputs.channel != 'review' && vars.INDEX_SITE == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run hosting:test
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event.inputs.channel || 'live' }}
          expires: 7d
          firebaseToolsVersion: 15.37.0
